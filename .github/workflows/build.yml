name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships cmdline-tools and platform-tools, so the
      # only packages needed are the compile platform and its build-tools.
      # `android-actions/setup-android` is deliberately not used: it tries to
      # install the legacy `tools` package, which the SDK repository no longer
      # serves, and the step fails before the build starts.
      #
      # The platform is `android-37.0`, not `android-37` — the minor-suffixed
      # naming is what the Compose BOM's AAR metadata requires.
      - name: Install SDK packages
        run: |
          sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "build-tools;37.0.0" \
            "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      # The release variant is the one that exercises the R8 rules, which is
      # where a minified-only failure would otherwise show up on a user's
      # device rather than in CI.
      - name: Minified release build
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Debug build
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tide-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore